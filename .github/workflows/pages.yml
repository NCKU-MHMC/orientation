name: Deploy slides to GitHub Pages

on:
  push:
    branches: [2026]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genai/package-lock.json
      # ponytail: --omit=dev skips the playwright-chromium download; only needed by npm run check
      - run: npm ci --omit=dev
        working-directory: genai
      - run: npm run build
        working-directory: genai
        env:
          BASE: /${{ github.event.repository.name }}/
      - name: Assemble site
        run: |
          mkdir -p _site/genai
          cp -r genai/dist/l1 genai/dist/l2 _site/genai/
          cp .github/pages-index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
